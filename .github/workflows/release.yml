name: Signed Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Publish even if this version is already released'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # AUD-013: the release job is gated on the web test suite and the type
  # check. A red suite means no signed release, ever.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run test

      - name: Type check
        run: bun run lint

  # KMP shared-edition tests: visible on every push, but not a release
  # gate — the KMP edition is not part of the shipped Capacitor artifact,
  # so its failures must not block Android releases.
  kmp-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: KMP tests (desktop target)
        working-directory: desktop
        run: |
          chmod +x gradlew
          ./gradlew desktopTest --no-daemon

  release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Build web app
        run: bun run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Sync Capacitor Android project
        run: bunx cap sync android

      # AUD-001: keystore.enc is wrapped with a dedicated long random
      # passphrase held only in this secret (rotated 2026-11-17); it is
      # NOT the keystore's own password.
      - name: Decrypt keystore
        env:
          ISECURE_ENC_PASSPHRASE: ${{ secrets.ISECURE_ENC_PASSPHRASE }}
        run: |
          openssl enc -d -aes-256-cbc -salt -pbkdf2 -md sha256 -in keystore.enc -out "$RUNNER_TEMP/release.p12" -pass env:ISECURE_ENC_PASSPHRASE
          ls -l "$RUNNER_TEMP/release.p12"
          sha256sum "$RUNNER_TEMP/release.p12"

      - name: Build signed release APK
        env:
          ISECURE_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          ISECURE_KEYSTORE_PASSWORD: ${{ secrets.ISECURE_KEYSTORE_PASSWORD }}
          ISECURE_KEY_ALIAS: ${{ secrets.ISECURE_KEY_ALIAS }}
          ISECURE_KEY_PASSWORD: ${{ secrets.ISECURE_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify signature and stage APK
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep "SHA-256 digest"
          cp android/app/build/outputs/apk/release/app-release.apk "iSecure-$VERSION-release.apk"
          sha256sum "iSecure-$VERSION-release.apk" > "iSecure-$VERSION-release.apk.sha256"
          cat "iSecure-$VERSION-release.apk.sha256"

      # AUD-005: a version tag denotes ONE immutable artifact set. When
      # the release already exists, the build above still verified the
      # tree, but nothing is re-published. Manual dispatch can force.
      - name: Gate re-publishing an existing version
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_RELEASE: ${{ inputs.force_release }}
        run: |
          if [ "$FORCE_RELEASE" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch with force_release — publishing."
          elif gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already published — publish step skipped (build was still verified)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: steps.gate.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: iSecure v${{ env.VERSION }}
          files: |
            iSecure-${{ env.VERSION }}-release.apk
            iSecure-${{ env.VERSION }}-release.apk.sha256
          body: |
            Signed release of iSecure — zero-knowledge password manager
            (Capacitor Android, com.isecure.app, minSdk 23, targetSdk 35).

            Signed with the shared Anvex/MarbleMD release key,
            cert SHA-256 f411316843add5339f1994f23c903b63b65a5cdd4e5d55d595bbe0bcbbd7439b.
